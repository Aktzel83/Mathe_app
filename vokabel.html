<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vokabel-Held 🦸‍♂️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #aufgabe {
            font-size: 2.5rem !important;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            line-height: 1.2;
            margin: 20px 0;
            padding: 15px;
        }
        
        #antwort-input {
            width: 90%;
            padding: 18px;
            font-size: 1.4rem;
            border: 4px solid var(--dark);
            border-radius: 20px;
            text-align: center;
            font-family: 'Arial Black', sans-serif;
            margin-bottom: 10px;
            background: #e3f2fd;
            box-shadow: 0 4px 0 var(--dark);
        }

        #sprach-modus {
            width: 95%;
            padding: 15px;
            font-size: 1.2rem;
            border: 4px solid var(--dark);
            border-radius: 20px;
            font-family: 'Arial Black', sans-serif;
            margin-bottom: 20px;
            background-color: white;
            cursor: pointer;
        }

        .btn-full {
            width: 100%;
            margin-top: 10px;
        }

        #ergebnis-text {
            max-height: 450px;
            overflow-y: auto;
            padding: 10px;
            text-align: center;
        }

        .fehler-box {
            margin-top: 20px;
            text-align: left;
            font-size: 1.1rem;
            background: #fff3cd;
            padding: 15px;
            border: 3px solid var(--dark);
            border-radius: 15px;
            box-shadow: 4px 4px 0 var(--dark);
        }

        .fehler-liste {
            padding-left: 25px;
            margin-top: 10px;
        }

        .fehler-item {
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .note-display {
            font-size: 4rem;
            margin: 15px 0;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 2px 2px 0 var(--dark);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>Vokabel-Held ✍️</h1>
        <input type="text" id="spieler-name" placeholder="Dein Name">
        
        <h3>Abfragemodus:</h3>
        <select id="sprach-modus">
            <option value="en_de">Englisch ➔ Deutsch</option>
            <option value="de_en">Deutsch ➔ Englisch</option>
            <option value="mix">Gemixt 🔄</option>
        </select>

        <button class="num-btn ok-btn btn-full" onclick="starteTraining()">STARTEN! 🚀</button>
        <button class="num-btn action-btn btn-full" onclick="window.location.href='index.html'" style="font-size: 1.2rem;">ZURÜCK 🏠</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="fortschritt">Wird geladen...</div>
        <div id="aufgabe">...</div>
        <input type="text" id="antwort-input" placeholder="Antwort tippen..." autocomplete="off">
        <button class="num-btn ok-btn btn-full" onclick="pruefeAntwort()">PRÜFEN! ✅</button>
        <button class="num-btn action-btn btn-full" onclick="abbruch()" style="font-size: 1.2rem; background-color: var(--comic-pink);">ABBRECHEN ❌</button>
        <div id="feedback"></div>
    </div>

    <div id="end-screen" class="hidden">
        <h1>BÄÄÄM! 🎉</h1>
        <div id="ergebnis-text"></div>
        <button class="num-btn ok-btn btn-full" onclick="location.reload()" style="margin-top: 20px;">NOCHMAL 🔄</button>
        <button class="num-btn btn-full" onclick="window.location.href='index.html'" style="background: var(--comic-blue); color: white;">HAUPTMENÜ 🏠</button>
    </div>
</div>

<script>
    let alleDaten = {};
    let config = {};
    let lernStapel = [];
    let fehlerListe = [];
    let aktuellerIndex = 0;
    let score = 0;
    let modus = "";

    document.getElementById('antwort-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') pruefeAntwort();
    });

    async function starteTraining() {
        try {
            const [vokabelRes, configRes] = await Promise.all([
                fetch('vocabulary.json?v=' + Date.now()),
                fetch('config.json?v=' + Date.now())
            ]);

            if (!vokabelRes.ok) throw new Error("Vokabeldatei fehlt");
            alleDaten = await vokabelRes.json();
            
            config = configRes.ok ? await configRes.json() : { 
                maxAlteWoerter: 8, 
                nurAktuellerBlock: false, 
                zufaelligeReihenfolge: true,
                noten: { "1": 0.9, "2": 0.8, "3": 0.7, "4": 0.6, "5": 0.3, "6": 0.0 }
            };
            
            modus = document.getElementById('sprach-modus').value;
            erstelleLernstapel();
            
            if (lernStapel.length === 0) {
                alert("Keine Vokabeln gefunden!");
                return;
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            zeigeVokabel();
        } catch (e) {
            alert("Fehler: " + e.message);
        }
    }

    function erstelleLernstapel() {
        const wochen = Object.keys(alleDaten);
        const neuesteWocheKey = wochen[wochen.length - 1];
        const alteWochenKeys = wochen.slice(0, -1);
        let stapel = [];
        fehlerListe = [];
        aktuellerIndex = 0;
        score = 0;

        for (let en in alleDaten[neuesteWocheKey]) {
            stapel.push({ en: en, de: alleDaten[neuesteWocheKey][en], woche: neuesteWocheKey });
        }

        if (!config.nurAktuellerBlock) {
            let altePool = [];
            alteWochenKeys.forEach(w => {
                for (let en in alleDaten[w]) {
                    altePool.push({ en: en, de: alleDaten[w][en], woche: w });
                }
            });
            altePool.sort(() => Math.random() - 0.5);
            stapel = stapel.concat(altePool.slice(0, config.maxAlteWoerter));
        }

        if (config.zufaelligeReihenfolge !== false) {
            stapel.sort(() => Math.random() - 0.5);
        }
        lernStapel = stapel;
    }

    function zeigeVokabel() {
        if (aktuellerIndex >= lernStapel.length) return zeigeEnde();
        const vokabel = lernStapel[aktuellerIndex];
        const anzeige = document.getElementById('aufgabe');
        const input = document.getElementById('antwort-input');
        input.value = "";
        input.focus();
        document.getElementById('feedback').innerText = "";
        document.getElementById('fortschritt').innerText = `WORT ${aktuellerIndex + 1} / ${lernStapel.length} (${vokabel.woche})`;

        let richtung = (modus === "mix") ? (Math.random() > 0.5 ? "en_de" : "de_en") : modus;
        if (richtung === "en_de") {
            anzeige.innerText = vokabel.en;
            anzeige.dataset.ziel = "de";
        } else {
            anzeige.innerText = vokabel.de[Math.floor(Math.random() * vokabel.de.length)];
            anzeige.dataset.ziel = "en";
        }
    }

    function pruefeAntwort() {
        const input = document.getElementById('antwort-input').value.trim().toLowerCase();
        if (input === "" || document.getElementById('quiz-screen').classList.contains('hidden')) return;

        const vokabel = lernStapel[aktuellerIndex];
        const frageText = document.getElementById('aufgabe').innerText;
        const ziel = document.getElementById('aufgabe').dataset.ziel;
        const fb = document.getElementById('feedback');
        
        let korrekt = (ziel === "de") ? vokabel.de.some(d => d.toLowerCase() === input) : vokabel.en.toLowerCase() === input;
        let loesung = (ziel === "de") ? vokabel.de.join(", ") : vokabel.en;

        if (korrekt) {
            score++;
            fb.innerText = "RICHTIG! 🌟";
            fb.style.color = "var(--comic-green)";
        } else {
            fb.innerText = `LÖSUNG: ${loesung}`;
            fb.style.color = "var(--comic-pink)";
            fehlerListe.push({ frage: frageText, antwort: loesung });
        }
        aktuellerIndex++;
        setTimeout(zeigeVokabel, 2000);
    }

    function abbruch() {
        if (confirm("Abbrechen?")) window.location.href = 'index.html';
    }

    function zeigeEnde() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        const name = document.getElementById('spieler-name').value || "Held";
        const prozent = score / lernStapel.length;
        const notenSkala = config.noten || { "1": 0.9, "2": 0.8, "3": 0.7, "4": 0.6, "5": 0.3, "6": 0.0 };
        
        let deineNote = "6";
        const sortierteNoten = Object.keys(notenSkala).sort((a, b) => a - b);
        for (let n of sortierteNoten) {
            if (prozent >= notenSkala[n]) {
                deineNote = n;
                break;
            }
        }

        const farbe = deineNote <= 2 ? "var(--comic-green)" : (deineNote <= 4 ? "var(--dark)" : "var(--comic-pink)");

        let html = `STARKER AUFTRITT, <b>${name}</b>!<br>`;
        html += `Ergebnis: <b>${score} von ${lernStapel.length}</b> (${Math.round(prozent * 100)}%)`;
        html += `<div class="note-display" style="color: ${farbe}">NOTE: ${deineNote}</div>`;
        
        if (fehlerListe.length > 0) {
            html += `<div class="fehler-box"><h3>Deine Patzer:</h3><ul class="fehler-liste">`;
            fehlerListe.forEach(f => { html += `<li class="fehler-item">❌ <b>${f.frage}</b><br>➔ Korrekt: <u>${f.antwort}</u></li>`; });
            html += `</ul></div>`;
        } else {
            html += `<br><b style="color:var(--comic-green)">PERFEKT! Alles richtig gewusst! 🏆</b>`;
        }
        document.getElementById('ergebnis-text').innerHTML = html;
    }
</script>
</body>
</html>
