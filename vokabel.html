<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vokabel-Held 🦸‍♂️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Kleine Ergänzung für die Vokabel-Ansicht, damit es nicht "falsch" aussieht */
        #aufgabe {
            font-size: 2.5rem !important; /* Etwas kleiner für lange Wörter */
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            line-height: 1.2;
        }
        select {
            appearance: none;
            background-color: #e3f2fd;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- STARTMENÜ -->
    <div id="start-screen">
        <h1>Vokabel-Held ✍️</h1>
        <input type="text" id="spieler-name" placeholder="Dein Name">
        
        <h3>Abfragemodus:</h3>
        <select id="sprach-modus" style="width: 90%; padding: 15px; font-size: 1.2rem; border: 4px solid var(--dark); border-radius: 20px; font-family: 'Arial Black', sans-serif; margin-bottom: 20px;">
            <option value="en_de">Englisch ➔ Deutsch</option>
            <option value="de_en">Deutsch ➔ Englisch</option>
            <option value="mix">Gemixt 🔄</option>
        </select>

        <button class="num-btn ok-btn" onclick="starteTraining()" style="width: 100%;">LERNEN STARTEN! 🚀</button>
    </div>

    <!-- QUIZ-BEREICH -->
    <div id="quiz-screen" class="hidden">
        <div id="fortschritt">Lädt...</div>
        <div id="aufgabe">...</div>
        
        <input type="text" id="antwort-input" placeholder="Antwort hier tippen..." autocomplete="off">
        
        <button class="num-btn ok-btn" onclick="pruefeAntwort()" id="check-btn" style="width: 100%;">PRÜFEN! ✅</button>
        
        <div id="feedback"></div>
    </div>

    <!-- ENDERGEBNIS -->
    <div id="end-screen" class="hidden">
        <h1>BÄÄÄM! 🎉</h1>
        <p id="ergebnis-text"></p>
        <button class="num-btn ok-btn" onclick="location.reload()" style="width: 100%;">NOCHMAL! 🔄</button>
    </div>
</div>

<script>
    let alleDaten = {};
    let lernStapel = [];
    let aktuellerIndex = 0;
    let score = 0;
    let modus = "";

    // Hilfsfunktion: Enter-Taste abfangen
    document.getElementById('antwort-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') pruefeAntwort();
    });

    async function starteTraining() {
        try {
            // Cache-Buster hinzugefügt (?v=...), damit er immer die neueste JSON lädt
            const response = await fetch('vocabulary.json?v=' + Date.now());
            if (!response.ok) throw new Error("Datei konnte nicht geladen werden (404)");
            
            const text = await response.text();
            // Hier prüfen wir, ob der Text wirklich gültiges JSON ist
            try {
                alleDaten = JSON.parse(text);
            } catch (e) {
                console.error("JSON Fehler Details:", text); // Zeigt in der Konsole, was falsch ist
                throw new Error("Die vocabulary.json hat einen Schreibfehler!");
            }
            
            modus = document.getElementById('sprach-modus').value;
            erstelleLernstapel();
            
            if (lernStapel.length === 0) {
                alert("Keine Vokabeln in der Datei gefunden!");
                return;
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            zeigeVokabel();
        } catch (e) {
            alert("⚠️ Fehler: " + e.message);
        }
    }

    function erstelleLernstapel() {
        const wochen = Object.keys(alleDaten);
        if (wochen.length === 0) return;

        const neuesteWocheKey = wochen[wochen.length - 1];
        const alteWochenKeys = wochen.slice(0, -1);

        let stapel = [];

        // Neueste Woche (komplett)
        for (let en in alleDaten[neuesteWocheKey]) {
            stapel.push({ en: en, de: alleDaten[neuesteWocheKey][en], woche: neuesteWocheKey });
        }

        // Alte Wochen (Zufalls-Mix)
        let alleAlten = [];
        alteWochenKeys.forEach(w => {
            for (let en in alleDaten[w]) {
                alleAlten.push({ en: en, de: alleDaten[w][en], woche: w });
            }
        });

        alleAlten.sort(() => Math.random() - 0.5);
        stapel = stapel.concat(alleAlten.slice(0, 8)); // 8 alte Vokabeln dazu
        
        stapel.sort(() => Math.random() - 0.5);
        lernStapel = stapel;
    }

    function zeigeVokabel() {
        if (aktuellerIndex >= lernStapel.length) return zeigeEnde();
        
        const vokabel = lernStapel[aktuellerIndex];
        const anzeige = document.getElementById('aufgabe');
        const input = document.getElementById('antwort-input');
        
        input.value = "";
        input.focus();
        document.getElementById('feedback').innerText = "";
        document.getElementById('fortschritt').innerText = `WORT ${aktuellerIndex + 1} / ${lernStapel.length} (${vokabel.woche})`;

        let richtung = modus;
        if (modus === "mix") richtung = Math.random() > 0.5 ? "en_de" : "de_en";

        if (richtung === "en_de") {
            anzeige.innerText = vokabel.en;
            anzeige.dataset.ziel = "de";
        } else {
            // Wählt zufällig eine der deutschen Übersetzungen als Frage
            anzeige.innerText = vokabel.de[Math.floor(Math.random() * vokabel.de.length)];
            anzeige.dataset.ziel = "en";
        }
    }

    function pruefeAntwort() {
        const inputField = document.getElementById('antwort-input');
        const input = inputField.value.trim().toLowerCase();
        if (input === "" || document.getElementById('quiz-screen').classList.contains('hidden')) return;

        const vokabel = lernStapel[aktuellerIndex];
        const ziel = document.getElementById('aufgabe').dataset.ziel;
        const fb = document.getElementById('feedback');
        
        let korrekt = false;
        let loesung = "";

        if (ziel === "de") {
            korrekt = vokabel.de.some(d => d.toLowerCase() === input);
            loesung = vokabel.de.join(", ");
        } else {
            korrekt = vokabel.en.toLowerCase() === input;
            loesung = vokabel.en;
        }

        if (korrekt) {
            score++;
            fb.innerText = "RICHTIG! 🌟";
            fb.style.color = "var(--comic-green)";
        } else {
            fb.innerText = `UPS! 💡 ${loesung}`;
            fb.style.color = "var(--comic-pink)";
        }

        aktuellerIndex++;
        setTimeout(zeigeVokabel, 2000);
    }

    function zeigeEnde() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        const name = document.getElementById('spieler-name').value || "Held";
        document.getElementById('ergebnis-text').innerHTML = 
            `STARK, <b>${name}</b>!<br>Du hast <b>${score} von ${lernStapel.length}</b> gewusst!`;
    }
</script>
</body>
</html>
