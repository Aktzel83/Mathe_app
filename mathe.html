<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- iPad & iPhone Home-Screen Icon Tags -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="apple-touch-icon-precomposed" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mathe-Held">

    <title>Mathe-Held ⚡</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .btn-full { width: 100%; margin-top: 15px; font-size: 1.2rem; padding: 15px; }
        .note-display { font-size: 4rem; margin: 15px 0; font-family: 'Arial Black', sans-serif; text-shadow: 2px 2px 0 var(--dark); }
        
        /* Fehler-Box Style */
        .fehler-box { 
            text-align: left; 
            background: #fff3cd; 
            padding: 15px; 
            border: 3px solid var(--dark); 
            border-radius: 15px; 
            margin: 20px 0;
            box-shadow: 4px 4px 0 var(--dark);
        }

        #gutschein-anzeige {
            display: none;
            margin: 20px 0;
            padding: 20px;
            background: #ffeb3b;
            border: 5px dashed var(--dark);
            border-radius: 15px;
            color: var(--dark);
            font-family: 'Arial Black', sans-serif;
            box-shadow: 8px 8px 0 var(--comic-pink);
        }
        .gutschein-titel { font-size: 1.5rem; text-decoration: underline; margin-bottom: 10px; }
        .gutschein-zeit { font-size: 2rem; color: #e91e63; }
        .gutschein-details { font-size: 0.9rem; margin: 10px 0; font-family: sans-serif; background: rgba(255,255,255,0.5); padding: 5px; border-radius: 5px; }
        .gutschein-info { font-size: 0.7rem; margin-top: 10px; border-top: 1px solid var(--dark); padding-top: 5px; font-family: sans-serif; font-weight: normal; }
        
        #ergebnis-text { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. STARTBILDSCHIRM -->
    <div id="start-screen">
        <h1>Mathe-Held ⚡</h1>
        <input type="text" id="spieler-name" placeholder="Dein Name">
        
        <h3>Wähle deine Zahlen:</h3>
        <div class="row-selection" id="zahlen-auswahl"></div>

        <h3>Rechenart:</h3>
        <div class="op-selection">
            <label><input type="radio" name="operator" value="mal" checked> Mal (×)</label>
            <label><input type="radio" name="operator" value="geteilt"> Geteilt (÷)</label>
            <label><input type="radio" name="operator" value="beides"> Beides</label>
        </div>

        <button class="num-btn ok-btn" onclick="starteQuiz()" style="width: 100%; margin-top: 20px;">SPIEL STARTEN! 🚀</button>
        <button class="num-btn action-btn btn-full" onclick="window.location.href='index.html'">ZURÜCK 🏠</button>
    </div>

    <!-- 2. QUIZ-BEREICH -->
    <div id="quiz-screen" class="hidden">
        <div id="fortschritt">Aufgabe 1 von 20</div>
        <div id="aufgabe">? × ?</div>
        <div id="display"></div>
        
        <div class="numpad">
            <div class="num-btn" onclick="addZahl(1)">1</div>
            <div class="num-btn" onclick="addZahl(2)">2</div>
            <div class="num-btn" onclick="addZahl(3)">3</div>
            <div class="num-btn" onclick="addZahl(4)">4</div>
            <div class="num-btn" onclick="addZahl(5)">5</div>
            <div class="num-btn" onclick="addZahl(6)">6</div>
            <div class="num-btn" onclick="addZahl(7)">7</div>
            <div class="num-btn" onclick="addZahl(8)">8</div>
            <div class="num-btn" onclick="addZahl(9)">9</div>
            <div class="num-btn action-btn" onclick="loesche()">⌫</div>
            <div class="num-btn" onclick="addZahl(0)">0</div>
            <div class="num-btn ok-btn" onclick="pruefeAntwort()">OK</div>
        </div>

        <button class="num-btn action-btn btn-full" onclick="abbruch()" style="background-color: var(--comic-pink);">ABBRECHEN ❌</button>
        <div id="feedback"></div>
    </div>

    <!-- 3. ENDERGEBNIS -->
    <div id="end-screen" class="hidden">
        <h1>ERGEBNIS 🎉</h1>
        <div id="ergebnis-text"></div>
        <div id="gutschein-anzeige"></div>
        
        <button id="gutschein-btn" class="num-btn action-btn btn-full hidden" style="background: #4caf50; color: white;" onclick="erzeugeGutschein()">GUTSCHEIN HOLEN! 🎁</button>
        <button class="num-btn ok-btn btn-full" onclick="location.reload()" style="margin-top: 20px;">NOCHMAL! 🔄</button>
        <button class="num-btn btn-full" onclick="window.location.href='index.html'" style="background: var(--comic-blue); color: white;">HAUPTMENÜ 🏠</button>
    </div>
</div>

<script>
    let name, gewaehlteZahlen = [], modus, runde = 1, score = 0, richtigesErgebnis;
    let aktuelleEingabe = "";
    let config = {};
    let erreichteNote = "6";
    let matheFehlerListe = [];

    // Zahlen-Buttons initialisieren
    const auswahlDiv = document.getElementById('zahlen-auswahl');
    for (let i = 1; i <= 10; i++) {
        auswahlDiv.innerHTML += `
            <label class="row-box" id="box-${i}">
                <input type="checkbox" value="${i}" checked style="display:none"> ${i}
            </label>`;
    }

    document.querySelectorAll('.row-box').forEach(box => {
        box.addEventListener('click', function() {
            const cb = this.querySelector('input');
            cb.checked = !cb.checked;
            updateBoxStyle(this, cb.checked);
        });
        updateBoxStyle(box, true);
    });

    function updateBoxStyle(el, checked) {
        el.style.background = checked ? '#2196f3' : '#eee';
        el.style.color = checked ? 'white' : 'black';
    }

    async function loadConfig() {
        try {
            const res = await fetch('config.json?v=' + Date.now());
            config = await res.json();
        } catch (e) {
            config = { 
                noten: { "1": 0.9, "2": 0.8, "3": 0.7, "4": 0.6, "5": 0.3, "6": 0.0 }, 
                belohnung: {"1": "60 Min. Switch", "2": "30 Min. Switch"} 
            };
        }
    }

    function addZahl(z) {
        if (aktuelleEingabe.length < 4) {
            aktuelleEingabe += z;
            document.getElementById('display').innerText = aktuelleEingabe;
        }
    }

    function loesche() {
        aktuelleEingabe = aktuelleEingabe.slice(0, -1);
        document.getElementById('display').innerText = aktuelleEingabe;
    }

    async function starteQuiz() {
        await loadConfig();
        name = document.getElementById('spieler-name').value || "Held";
        modus = document.querySelector('input[name="operator"]:checked').value;
        const checkboxes = document.querySelectorAll('#zahlen-auswahl input:checked');
        gewaehlteZahlen = Array.from(checkboxes).map(cb => parseInt(cb.value));
        matheFehlerListe = [];
        runde = 1;
        score = 0;

        if (gewaehlteZahlen.length === 0) {
            alert("Wähle mindestens eine Zahl aus! 😉");
            return;
        }

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        neueAufgabe();
    }

    function neueAufgabe() {
        if (runde > 20) return zeigeEnde();
        aktuelleEingabe = "";
        document.getElementById('display').innerText = "";
        document.getElementById('feedback').innerText = "";
        document.getElementById('fortschritt').innerText = `AUFGABE ${runde} / 20`;
        
        const z1 = gewaehlteZahlen[Math.floor(Math.random() * gewaehlteZahlen.length)];
        const z2 = Math.floor(Math.random() * 10) + 1;
        
        let op = modus;
        if (modus === 'beides') op = Math.random() > 0.5 ? 'mal' : 'geteilt';

        if (op === 'mal') {
            richtigesErgebnis = z1 * z2;
            document.getElementById('aufgabe').innerText = `${z1} × ${z2}`;
        } else {
            richtigesErgebnis = z2;
            document.getElementById('aufgabe').innerText = `${z1 * z2} ÷ ${z1}`;
        }
    }

    function pruefeAntwort() {
        if (aktuelleEingabe === "" || document.getElementById('quiz-screen').classList.contains('hidden')) return;
        const userAntwort = parseInt(aktuelleEingabe);
        const fb = document.getElementById('feedback');
        const aktuelleAufgabeText = document.getElementById('aufgabe').innerText;

        if (userAntwort === richtigesErgebnis) {
            score++;
            fb.innerText = "RICHTIG! 🔥";
            fb.style.color = "#4caf50";
        } else {
            fb.innerText = `UPS! ES WAR ${richtigesErgebnis} 💡`;
            fb.style.color = "#ff4081";
            matheFehlerListe.push({ aufgabe: aktuelleAufgabeText, falsch: userAntwort, korrekt: richtigesErgebnis });
        }

        runde++;
        setTimeout(neueAufgabe, 1200);
    }

    function abbruch() {
        if (confirm("Wirklich abbrechen?")) window.location.href = 'index.html';
    }

    function zeigeEnde() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        
        const prozent = score / 20;
        erreichteNote = "6";
        const sortierteNoten = Object.keys(config.noten).sort((a, b) => a - b);
        for (let n of sortierteNoten) {
            if (prozent >= config.noten[n]) {
                erreichteNote = n;
                break;
            }
        }

        const farbe = erreichteNote <= 2 ? "var(--comic-green)" : (erreichteNote <= 4 ? "var(--dark)" : "var(--comic-pink)");
        
        let html = `STARK, <b>${name}</b>!<br>Ergebnis: <b>${score} von 20</b>`;
        html += `<div class="note-display" style="color: ${farbe}">NOTE: ${erreichteNote}</div>`;
        
        if (matheFehlerListe.length > 0) {
            html += `<div class="fehler-box"><h3>Deine Berichtigung:</h3><ul style="padding-left: 20px;">`;
            matheFehlerListe.forEach(f => {
                html += `<li style="margin-bottom: 5px;">❌ ${f.aufgabe} = <span style="text-decoration: line-through;">${f.falsch}</span> ➔ <span style="color: green; font-weight: bold;">${f.korrekt}</span></li>`;
            });
            html += `</ul></div>`;
        } else {
            html += `<p style="color: var(--comic-green); font-weight: bold;">PERFEKT! Alles richtig! 🏆</p>`;
        }

        if (erreichteNote === "1" || erreichteNote === "2") {
            document.getElementById('gutschein-btn').classList.remove('hidden');
        }
        
        document.getElementById('ergebnis-text').innerHTML = html;
    }

    function erzeugeGutschein() {
        const zeit = config.belohnung[erreichteNote] || "Bonuszeit";
        const jetzt = new Date();
        const stamp = jetzt.toLocaleDateString() + " um " + jetzt.toLocaleTimeString();
        
        let modusName = modus === "mal" ? "Malreihen (×)" : (modus === "geteilt" ? "Geteilt (÷)" : "Gemixt (×/÷)");
        
        const gDiv = document.getElementById('gutschein-anzeige');
        gDiv.innerHTML = `
            <div class="gutschein-titel">🎮 MATHE-BONUS 🎮</div>
            <div class="gutschein-zeit">${zeit}</div>
            <div class="gutschein-details">
                <b>Held:</b> ${name}<br>
                <b>Modus:</b> ${modusName}<br>
                <b>Zahlen:</b> ${gewaehlteZahlen.join(", ")}
            </div>
            <div class="gutschein-info">Erreicht am: ${stamp}<br>Code: M-${Math.random().toString(36).substr(2, 5).toUpperCase()}</div>
        `;
        gDiv.style.display = "block";
        document.getElementById('gutschein-btn').classList.add('hidden');
    }
</script>

</body>
</html>
